name: Build XCFramework for SPM

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual triggering
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'build-xcframework.sh'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Make build script executable
      run: chmod +x build-xcframework.sh
      
    - name: Build XCFramework
      run: ./build-xcframework.sh
      
    - name: Verify XCFramework
      run: |
        if [ ! -d "build/xcframework/firestore-kmp.xcframework" ]; then
          echo "❌ XCFramework not found!"
          exit 1
        fi
        echo "✅ XCFramework built successfully"
        ls -lh build/xcframework/firestore-kmp.xcframework/
        
    - name: Upload XCFramework artifact
      uses: actions/upload-artifact@v4
      with:
        name: firestore-kmp-xcframework
        path: build/xcframework/firestore-kmp.xcframework
        retention-days: 30
        
    - name: Zip XCFramework for release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd build/xcframework
        zip -r firestore-kmp.xcframework.zip firestore-kmp.xcframework
        cd ../..
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: build/xcframework/firestore-kmp.xcframework.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Commit XCFramework (on main/master)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add build/xcframework/firestore-kmp.xcframework
        git diff --staged --quiet || git commit -m "chore: update XCFramework for SPM distribution [skip ci]"
        git push || echo "No changes to commit"

